services:
  postgres:
    image: postgres:16-alpine
    container_name: voting-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-voting}
      POSTGRES_USER: ${DB_USERNAME:-voting}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-voting}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
